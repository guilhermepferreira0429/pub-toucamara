name: toucamara_app
description: "Apps Android do Tou, Câmara?: equipa de campo (flavor equipa) e munícipe (flavor municipe)."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  image_picker: ^1.2.4
  geolocator: ^14.1.2
  speech_to_text: ^7.5.0
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  open_filex: ^5.0.0
  uuid: ^4.6.0
  web: ^1.1.1
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
